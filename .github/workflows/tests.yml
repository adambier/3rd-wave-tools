# Runs the libraries' tests on Linux, macOS, and Windows on every push and pull request, so that
# PgdataFormats, WavetableFormats, and PgdataPackerCore keep building everywhere Swift runs. The macOS app itself is
# built and released separately with make-app.sh.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: PGDATA_TESTS=1 swift test
      # The shipped app is one module compiled from all four Sources folders (make-app.sh), which
      # SwiftPM never checks: a top-level name shared by two folders, or a symbol one folder uses
      # from another without `public`, fails only there. This type-checks that build without
      # Sparkle (main.swift guards it) and without producing an app bundle.
      - name: Type-check the app as one module
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-macos13.0 -module-name PgdataPacker \
            Sources/PgdataFormats/*.swift Sources/WavetableFormats/*.swift \
            Sources/PgdataPackerCore/*.swift Sources/PgdataPacker/*.swift

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      # Swift 6.0.3 cannot build any package manifest against the runner's current Windows SDK
      # (a module cycle in the C runtime headers); a newer toolchain can.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Test
        env:
          PGDATA_TESTS: "1"
        run: swift test
